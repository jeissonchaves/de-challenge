version: 2

models:

  # ─── DIMENSIONES ─────────────────────────────────────────────────────────────

  - name: dim_date
    description: >
      Dimensión de tiempo generada sintéticamente con GENERATOR de Snowflake.
      Cubre el período 2010-01-01 a 2030-12-31 (~7670 filas).
      Clave de unión: DATE_KEY en formato YYYYMMDD (INT).
    columns:
      - name: DATE_KEY
        description: Clave primaria en formato YYYYMMDD (INT)
        tests:
          - unique
          - not_null
      - name: FULL_DATE
        description: Fecha completa (DATE)
        tests:
          - not_null
      - name: YEAR
        tests:
          - not_null
      - name: MONTH_NUMBER
        tests:
          - not_null
      - name: DAY_OF_WEEK
        description: 1=Lunes, 7=Domingo (ISO)
        tests:
          - not_null

  - name: dim_member
    description: >
      Dimensión de miembro deduplicada a nivel MEMBER_ID.
      Un miembro puede pertenecer a múltiples grupos en staging; aquí
      se agrega a una sola fila por miembro con métricas de actividad
      (TOTAL_GROUPS, TENURE_DAYS, TENURE_BUCKET, IS_MULTI_GROUP).
    columns:
      - name: MEMBER_ID
        description: Clave primaria del miembro
        tests:
          - unique
          - not_null
      - name: TENURE_BUCKET
        description: "Segmento de antigüedad: '< 1yr' / '1-2yr' / '2-5yr' / '5yr+'"
        tests:
          - not_null
          - accepted_values:
              values: ['< 1yr', '1-2yr', '2-5yr', '5yr+']
      - name: TOTAL_GROUPS
        description: Cantidad de grupos a los que pertenece el miembro
        tests:
          - not_null
      - name: IS_MULTI_GROUP
        description: TRUE si el miembro pertenece a más de un grupo

  - name: dim_group
    description: >
      Dimensión de grupo con categoría, geografía y flags de calidad.
      CATEGORY se toma directamente de stg_groups (ya desnormalizado).
    columns:
      - name: GROUP_ID
        description: Clave primaria del grupo
        tests:
          - unique
          - not_null
      - name: CATEGORY
        description: Categoría del grupo (ej. Tech, Sports)
      - name: IS_ORPHAN
        description: TRUE si el grupo no tiene organizador activo

  # ─── FACTS ───────────────────────────────────────────────────────────────────

  - name: fact_attendance
    description: >
      Tabla de hechos de asistencia a nivel de evento (granularidad = 1 fila por evento).
      No existe tabla de RSVPs individuales; las métricas se obtienen de stg_events
      (YES_RSVP_COUNT, HEADCOUNT, WAITLIST_COUNT, etc.).
      KPIs derivados:
        - SHOW_RATE = HEADCOUNT / YES_RSVP_COUNT (presentismo real)
        - ATTENDANCE_RATE = HEADCOUNT / RSVP_LIMIT (% de cupo ocupado)
    columns:
      - name: EVENT_ID
        description: Clave primaria del evento
        tests:
          - unique
          - not_null
      - name: GROUP_ID
        description: FK a dim_group
        tests:
          - not_null
          - relationships:
              to: ref('dim_group')
              field: GROUP_ID
      - name: YES_RSVP_COUNT
        description: RSVPs confirmados (coalesce 0 si NULL)
        tests:
          - not_null
      - name: HEADCOUNT
        description: Asistentes reales validados
        tests:
          - not_null
      - name: SHOW_RATE
        description: Ratio HEADCOUNT / YES_RSVP_COUNT. NULL si divisor es 0.
      - name: ATTENDANCE_RATE
        description: Ratio HEADCOUNT / RSVP_LIMIT. NULL si no hay cupo definido.
      - name: HAS_FEE
        description: TRUE si FEE_AMOUNT > 0

  # ─── MARTS ───────────────────────────────────────────────────────────────────

  - name: mart_event_engagement
    description: >
      Mart de engagement por evento. Une fact_attendance con dim_group y dim_date.
      Responde: asistentes por evento, grupos con más engagement, categorías con más asistencia.
    columns:
      - name: EVENT_ID
        tests:
          - unique
          - not_null

  - name: mart_member_activity
    description: >
      Mart de actividad de miembros. Segmenta usuarios por ACTIVITY_SEGMENT
      (Power User / Active / Single-Group / Inactive) y TENURE_BUCKET.
      Responde: usuarios más activos, retención, % multi-grupo.
    columns:
      - name: MEMBER_ID
        tests:
          - unique
          - not_null
      - name: ACTIVITY_SEGMENT
        tests:
          - accepted_values:
              values: ['Power User', 'Active', 'Single-Group', 'Inactive']

  - name: mart_geo_activity
    description: >
      Mart de actividad geográfica por ciudad/año. Incluye YOY_GROWTH_PCT
      calculado con LAG sobre la partición ciudad-país.
      Responde: ciudades con más actividad y crecimiento.

  - name: mart_temporal_trends
    description: >
      Mart de tendencias temporales a granularidad mensual.
      Incluye MOM_EVENTS_GROWTH_PCT y MOM_RSVP_GROWTH_PCT con LAG.
      Responde: días/meses con más asistencia, evolución de RSVPs.
    columns:
      - name: YEAR
        tests:
          - not_null
      - name: MONTH_NUMBER
        tests:
          - not_null

  - name: mart_group_growth
    description: >
      Mart de crecimiento y engagement por grupo. Incluye ENGAGEMENT_SCORE
      (score compuesto: log10(RSVP+1) × SHOW_RATE × RATING), RANK_IN_CATEGORY
      y GLOBAL_RANK por headcount.
      Responde: grupos con más engagement, top grupos por categoría.
    columns:
      - name: GROUP_ID
        tests:
          - unique
          - not_null
