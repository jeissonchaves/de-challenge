name: 'meetup_dbt'
version: '1.0.0'
config-version: 2

profile: 'meetup_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  meetup_dbt:
    staging:
      +materialized: incremental
    analytics:
      +materialized: table
      +schema: analytics
